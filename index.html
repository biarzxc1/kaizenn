    <link rel="icon" href="https://imgur.com/5e5eBdd.jpg" type="image/jpeg">
    <link rel="shortcut icon" href="https://imgur.com/5e5eBdd.jpg" type="image/jpeg">

    <meta property="og:title" content="kaizen - Portfolio" />
    <meta property="og:description" content="Portfolio - Developer & Designer" />
    <meta property="og:image" content="https://imgur.com/5e5eBdd.jpg" />

    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=TikTok+Sans:opsz,wght@12..36,300..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button class="theme-toggle" id="themeToggle" title="Toggle theme" aria-label="Toggle dark/light mode">
        <i data-lucide="sun" class="icon-sun" aria-hidden="true"></i>
        <i data-lucide="moon" class="icon-moon" aria-hidden="true"></i>
    </button>
    <div class="container">
        <div class="profile-section">
            <div class="profile-image-wrapper">
                <div class="glow-ring"></div>
                <img src="https://imgur.com/5e5eBdd.jpg" alt="Profile Picture" class="profile-image">
            </div>

            <h1 class="profile-name" id="profileName"></h1>
            <p class="profile-subtitle">developer</p>
            <p class="beta-label">(beta)</p>
            <p class="profile-quote" id="typingQuote">
                <span id="quoteText"></span><span class="typing-cursor"></span>
            </p>

            <div class="social-icons" id="socialIcons"></div>
        </div>

        <section class="about-section" aria-labelledby="aboutTitle">
            <h2 class="about-title" id="aboutTitle">About me</h2>
            <p class="about-text" id="aboutText"></p>

            <h3 class="skills-title">My Skillz</h3>
            <div class="skills-list" id="skillsList"></div>

            <h3 class="projects-title">Projects</h3>
            <div class="projects-list" id="projectsList"></div>
        </section>

        <div class="footer">
            <p class="footer-text">&copy; 2026 | Developed by kaizen</p>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="script.js"></script>
</body>
